name: Publish Docs

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to attach the docs bundle to. Default value: latest release.'
        required: false

jobs:
  publish:
    name: Publish Docs to the Knowledge Base
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required - the action uploads a release asset
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Render and publish single-page docs
        uses: AbsaOSS/knowledge-base/actions/publish-single-page-docs@master
        with:
          # Empty on the release trigger, where the event tag is used instead.
          # Empty on both - the action resolves the repository's latest release.
          release-tag: ${{ inputs.release-tag || github.event.release.tag_name }}
          docs: |
            - md: docs/index.md
              title: Organizational Workflows
              description: Reusable GitHub Actions workflows with Python automation backends, shared across the organization.
              slug: org-workflows
              icon: collection
              tags: [workflows, automation]
            - md: docs/security/security.md
              title: Security Automation
              description: Turns AquaSec scan findings into a managed GitHub Issues backlog with full lifecycle automation.
              slug: org-workflows-security
              icon: shield
              tags: [security, automation]
